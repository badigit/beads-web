[package]
name = "beads-server"
version = "0.11.2"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# interpolate-folder-path: the frontend directory is resolved by build.rs and
# passed in through BEADS_WEB_FRONTEND_DIR (see the #[folder] attribute in main.rs).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
open = "5"
mime_guess = "2"
notify = "6"
# `sync` enables BroadcastStream, used to fan one Dolt revision poller out to
# every connected SSE client (routes/dolt_watch.rs).
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
directories = "5"
serde_yaml = "0.9"
regex = "1"
# default-features off убирает C-тулчейн из графа. На 0.34 этого было мало: там
# mysql_common тянул zstd (=> zstd-sys => bindgen/cmake) БЕЗУСЛОВНО. С 0.37/0.38
# zstd ушёл за фичу binlog (`binlog = [dep:zstd]`), поэтому minimal-rust без
# binlog даёт граф вообще без C: уходят bindgen, clang-sys, cmake, libz-sys.
# minimal-rust = flate2/rust_backend (чистый Rust). Мы читаем из Dolt только
# String/i32/i64 (dolt.rs) — конверсии bigdecimal/rust_decimal/time/frunk не
# нужны; подключение plain-TCP по mesh (build_opts не ставит ssl_opts) — TLS-фича
# тоже не нужна; binlog/репликацию не читаем.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"

# Урезанная отладочная информация. Замер 2026-07-25, холодная
# `cargo build --tests` в изолированном target:
#   время  1m32s -> 1m29s  (шум, ускорения тут НЕТ)
#   размер 1.57 GB -> 0.91 GB  (-42%)
# Ради размера правка и сделана: `cargo` заводит свой target/ на каждый worktree,
# то есть на каждый бид, и гигабайт с лишним на копию — это ощутимо.
# `line-tables-only` сохраняет номера строк в панике и бэктрейсах; теряется
# пошаговая отладка в дебаггере, которой в этом проекте никто не пользуется.
[profile.dev]
debug = "line-tables-only"

# Зависимости отлаживают ещё реже, чем свой код: их отладочная информация — почти
# весь выигрыш выше.
[profile.dev.package."*"]
debug = false
